<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Usuario - Salud</title>
</head>

<body>
    <h1 th:text="${usuario.id == null ? 'Nuevo usuario' : 'Editar usuario'}"></h1>
    
    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{activo}">

        <label for="cedula">Cédula:</label>
        <input type="text" id="cedula" th:field="*{cedula}" required>
        <br>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" th:field="*{nombre}" required>
        <br>

        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fecha_nacimiento" th:field="*{fecha_nacimiento}">
        <br><br>

        <label>Rol:</label>
        <input type="radio" id="rol-admin" th:field="*{rol}" value="ADMIN">
        <label for="rol-admin">Administrador</label>

        <input type="radio" id="rol-medico" th:field="*{rol}" value="MEDICO">
        <label for="rol-medico">Médico</label>

        <input type="radio" id="rol-paciente" th:field="*{rol}" value="PACIENTE">
        <label for="rol-paciente">Paciente</label>
        <br>

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" th:field="*{telefono}">
        <br>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" th:field="*{correo}" required>
        <br>

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" th:field="*{contrasena}" required>
        <br><br>

        <button type="submit">Guardar</button>
    </form>
</body>
</html>
